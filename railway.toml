# Railway deploys the Pokémon Center queue worker from the monorepo root.
# Vercel hosts the Next.js app — this service must NOT run `next build` / `next start`.
#
# Recommended: set Railway Root Directory to `worker` (uses worker/Dockerfile).
# Alternative: leave Root Directory empty (uses Dockerfile.worker below).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "node dist/worker.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 30
