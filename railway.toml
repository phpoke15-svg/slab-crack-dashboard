# Railway deploys the Pokémon Center queue worker from the monorepo root.
# (Vercel hosts the Next.js app — do not use `npm start` / `next start` here.)
#
# Dashboard: you can leave Root Directory empty or set it to `worker`.
# If Root Directory is `worker`, `worker/railway.toml` applies instead.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:worker"

[deploy]
startCommand = "npm run start:worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 30
