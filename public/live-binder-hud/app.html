<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Live Binder HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="stage">
    <div id="viewport">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="capture" aria-hidden="true"></canvas>
      <div id="hudLayer" aria-live="polite"></div>
    </div>

    <div id="dock">
      <div class="brand-row">
        <div class="brand">Live Binder <span>HUD</span></div>
        <div id="status">Starting…</div>
      </div>

      <div class="controls">
        <button id="scanBtn" class="primary" type="button">Scan Feed</button>
        <label class="toggle">
          <input id="autoScan" type="checkbox" checked />
          Auto-scan when stable 2s
        </label>
        <input id="pcKey" type="password" placeholder="PriceCharting API key (optional)" autocomplete="off" />
        <button id="clearHud" type="button">Clear HUD</button>
      </div>

      <div class="meta">
        <span>Mode: <strong>Gemini box_2d</strong></span>
        <span>Any layout · 1–9+ cards · one still frame</span>
        <span id="modelTag">Prices via PriceCharting</span>
      </div>
    </div>
  </div>

  <script src="./js/cache.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/hud.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
