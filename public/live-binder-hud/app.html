<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Live Binder HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="frame"></canvas>
    <canvas id="overlay"></canvas>

    <div id="hud">
      <div class="brand-row">
        <div class="brand">Live Binder <span>HUD</span></div>
        <div id="status">Starting…</div>
      </div>

      <div class="controls">
        <button id="scanBtn" class="primary" type="button">Scan Page</button>
        <label class="toggle">
          <input id="autoScan" type="checkbox" checked />
          Auto-scan when stable 2s
        </label>
        <input id="pcKey" type="password" placeholder="PriceCharting API key (optional)" autocomplete="off" />
        <button id="clearCache" type="button">Clear cache</button>
      </div>

      <div class="meta">
        <span>CV: <strong id="cvSource">…</strong></span>
        <span>Outlines are local · Gemini only on Scan Page</span>
        <span>Prices cached in localStorage</span>
      </div>
    </div>
  </div>

  <script src="./js/grid-detect.js"></script>
  <script src="./js/cache.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/overlay.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
