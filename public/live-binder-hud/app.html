<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <title>Live Binder HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./app.css?v=20260715d" />
</head>
<body>
  <div id="stage">
    <div id="viewport">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="capture" aria-hidden="true"></canvas>
      <div id="hudLayer" aria-live="polite"></div>
    </div>

    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <div id="dock">
      <div class="brand-row">
        <div class="brand">Live Binder <span>HUD</span></div>
        <div id="status">Starting…</div>
      </div>

      <div class="controls">
        <button id="scanBtn" class="primary" type="button">Scan Feed</button>
        <button id="clearHud" type="button">Clear HUD</button>
      </div>

      <div class="meta">
        <span>Build: <strong id="buildTag">20260715d</strong></span>
        <span>Direct → Gemini · prices via server key</span>
        <span id="modelTag">PriceCharting (server)</span>
      </div>
    </div>
  </div>

  <script src="./js/cache.js?v=20260715d"></script>
  <script src="./js/api.js?v=20260715d"></script>
  <script src="./js/hud.js?v=20260715d"></script>
  <script src="./js/main.js?v=20260715d"></script>
</body>
</html>
