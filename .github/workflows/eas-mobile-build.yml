name: EAS Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: android, ios, or all
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      auto_submit:
        description: Submit to Play / App Store after build
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "apps/pc-queue-watch/**"
      - ".github/workflows/eas-mobile-build.yml"

jobs:
  build-android:
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pc-queue-watch/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/pc-queue-watch
        run: npm ci

      - name: Verify Play Android config
        working-directory: apps/pc-queue-watch
        run: npm run verify:play-android

      - name: Build Android production AAB
        working-directory: apps/pc-queue-watch
        run: >
          npx eas-cli build -p android --profile production --non-interactive
          ${{ github.event_name == 'workflow_dispatch' && inputs.auto_submit && '--auto-submit' || '' }}

  build-ios:
    if: >
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.platform == 'ios' ||
        github.event.inputs.platform == 'all'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pc-queue-watch/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/pc-queue-watch
        run: npm ci

      - name: Build iOS production IPA
        working-directory: apps/pc-queue-watch
        run: >
          npx eas-cli build -p ios --profile production --non-interactive
          ${{ inputs.auto_submit && '--auto-submit' || '' }}
